    <script>
      const SAMPLE_RATE = 48000;
      const MIN_FILTER_Q = 0.01;
      const MAX_FILTER_Q = 12;

      function clampFilterQ(q) {
        return Math.max(MIN_FILTER_Q, Math.min(MAX_FILTER_Q, Number(q) || MIN_FILTER_Q));
      }

      function calculateFilterEffect(f, fc, gain, q, sampleRate, type = 'PK') {
        q = clampFilterQ(q);
        if (gain === 0) return 0;
        if (fc >= sampleRate / 2 || f >= sampleRate / 2) return 0;
        const w0 = (2 * Math.PI * fc) / sampleRate;
        const w = (2 * Math.PI * f) / sampleRate;
        const cosW0 = Math.cos(w0);
        const sinW0 = Math.sin(w0);
        const A = Math.pow(10, gain / 40);
        const alpha = sinW0 / (2 * q);
        let b0, b2, a0, a2;
        let sum_b, linear_b, sum_a, linear_a;
        const sinSqW0 = Math.sin(w0 / 2) * Math.sin(w0 / 2);
        if (type === 'LSC') {
          const twoSqrtAAlpha = 2 * Math.sqrt(A) * alpha;
          b0 = A * (A + 1 - (A - 1) * cosW0 + twoSqrtAAlpha);
          b2 = A * (A + 1 - (A - 1) * cosW0 - twoSqrtAAlpha);
          a0 = A + 1 + (A - 1) * cosW0 + twoSqrtAAlpha;
          a2 = A + 1 + (A - 1) * cosW0 - twoSqrtAAlpha;
          sum_b = 8 * A * A * sinSqW0;
          linear_b = sum_b + 4 * A * Math.sqrt(A) * alpha;
          sum_a = 8 * sinSqW0;
          linear_a = sum_a + 4 * Math.sqrt(A) * alpha;
        } else if (type === 'HSC') {
          const twoSqrtAAlpha = 2 * Math.sqrt(A) * alpha;
          b0 = A * (A + 1 + (A - 1) * cosW0 + twoSqrtAAlpha);
          b2 = A * (A + 1 + (A - 1) * cosW0 - twoSqrtAAlpha);
          a0 = A + 1 - (A - 1) * cosW0 + twoSqrtAAlpha;
          a2 = A + 1 - (A - 1) * cosW0 - twoSqrtAAlpha;
          sum_b = 8 * A * sinSqW0;
          linear_b = sum_b + 4 * A * Math.sqrt(A) * alpha;
          sum_a = 8 * A * sinSqW0;
          linear_a = sum_a + 4 * Math.sqrt(A) * alpha;
        } else {
          b0 = 1 + alpha * A;
          b2 = 1 - alpha * A;
          a0 = 1 + alpha / A;
          a2 = 1 - alpha / A;
          sum_b = 4 * sinSqW0;
          linear_b = sum_b + 2 * alpha * A;
          sum_a = sum_b;
          linear_a = sum_a + (2 * alpha) / A;
        }
        const dz_re = -2 * Math.sin(w / 2) * Math.sin(w / 2);
        const dz_im = Math.sin(w);
        const dz2_re = dz_re * dz_re - dz_im * dz_im;
        const dz2_im = 2 * dz_re * dz_im;
        const num_re = b0 * dz2_re + linear_b * dz_re + sum_b;
        const num_im = b0 * dz2_im + linear_b * dz_im;
        const numMagSq = num_re * num_re + num_im * num_im;
        const den_re = a0 * dz2_re + linear_a * dz_re + sum_a;
        const den_im = a0 * dz2_im + linear_a * dz_im;
        const denMagSq = den_re * den_re + den_im * den_im;
        if (denMagSq <= 1e-20 || isNaN(denMagSq) || isNaN(numMagSq)) return 0;
        const ratio = numMagSq / denMagSq;
        if (ratio <= 1e-20) return -200;
        return 10 * Math.log10(ratio);
      }

      function computeFilterCoeffs(fc, gain, q, sampleRate, type) {
        q = clampFilterQ(q);
        if (gain === 0) return null;
        if (fc >= sampleRate / 2) return null;
        const w0 = (2 * Math.PI * fc) / sampleRate;
        const cosW0 = Math.cos(w0);
        const sinW0 = Math.sin(w0);
        const A = Math.pow(10, gain / 40);
        const alpha = sinW0 / (2 * q);
        const sinSqW0 = Math.sin(w0 / 2) * Math.sin(w0 / 2);
        let b0, sum_b, linear_b, sum_a, linear_a, a0;
        if (type === 'LSC') {
          const twoSqrtAAlpha = 2 * Math.sqrt(A) * alpha;
          b0 = A * (A + 1 - (A - 1) * cosW0 + twoSqrtAAlpha);
          sum_b = 8 * A * A * sinSqW0;
          linear_b = sum_b + 4 * A * Math.sqrt(A) * alpha;
          sum_a = 8 * sinSqW0;
          linear_a = sum_a + 4 * Math.sqrt(A) * alpha;
          a0 = A + 1 + (A - 1) * cosW0 + twoSqrtAAlpha;
        } else if (type === 'HSC') {
          const twoSqrtAAlpha = 2 * Math.sqrt(A) * alpha;
          b0 = A * (A + 1 + (A - 1) * cosW0 + twoSqrtAAlpha);
          sum_b = 8 * A * sinSqW0;
          linear_b = sum_b + 4 * A * Math.sqrt(A) * alpha;
          sum_a = 8 * A * sinSqW0;
          linear_a = sum_a + 4 * Math.sqrt(A) * alpha;
          a0 = A + 1 - (A - 1) * cosW0 + twoSqrtAAlpha;
        } else {
          b0 = 1 + alpha * A;
          sum_b = 4 * sinSqW0;
          linear_b = sum_b + 2 * alpha * A;
          sum_a = sum_b;
          linear_a = sum_a + (2 * alpha) / A;
          a0 = 1 + alpha / A;
        }
        return { b0, a0, sum_b, linear_b, sum_a, linear_a };
      }

      function evalFilterBatch(coeffs, dz_re, dz_im, dz2_re, dz2_im, N, output) {
        if (!coeffs) {
          output.fill(0);
          return;
        }
        const { b0, a0, sum_b, linear_b, sum_a, linear_a } = coeffs;
        for (let i = 0; i < N; i++) {
          const num_re = b0 * dz2_re[i] + linear_b * dz_re[i] + sum_b;
          const num_im = b0 * dz2_im[i] + linear_b * dz_im[i];
          const numMagSq = num_re * num_re + num_im * num_im;
          const den_re = a0 * dz2_re[i] + linear_a * dz_re[i] + sum_a;
          const den_im = a0 * dz2_im[i] + linear_a * dz_im[i];
          const denMagSq = den_re * den_re + den_im * den_im;
          if (denMagSq <= 1e-20 || isNaN(denMagSq) || isNaN(numMagSq)) { output[i] = 0; continue; }
          const ratio = numMagSq / denMagSq;
          output[i] = ratio <= 1e-20 ? -200 : 10 * Math.log10(ratio);
        }
      }

      function precomputeFreqData(evalFreqs, sampleRate, N) {
        const dz_re = new Float64Array(N);
        const dz_im = new Float64Array(N);
        const dz2_re = new Float64Array(N);
        const dz2_im = new Float64Array(N);
        for (let i = 0; i < N; i++) {
          const w = (2 * Math.PI * evalFreqs[i]) / sampleRate;
          const sinHalfW = Math.sin(w / 2);
          const sre = -2 * sinHalfW * sinHalfW;
          const sim = Math.sin(w);
          dz_re[i] = sre;
          dz_im[i] = sim;
          dz2_re[i] = sre * sre - sim * sim;
          dz2_im[i] = 2 * sre * sim;
        }
        return { dz_re, dz_im, dz2_re, dz2_im };
      }

      function evalAndAccumulate(coeffs, dz_re, dz_im, dz2_re, dz2_im, N, residual, weights, output) {
        if (!coeffs) {
          let num = 0, den = 0;
          for (let i = 0; i < N; i++) {
            num += residual[i] * 0 * weights[i];
            den += 0;
          }
          return { num, den };
        }
        const { b0, a0, sum_b, linear_b, sum_a, linear_a } = coeffs;
        let num = 0, den = 0;
        for (let i = 0; i < N; i++) {
          const num_re = b0 * dz2_re[i] + linear_b * dz_re[i] + sum_b;
          const num_im = b0 * dz2_im[i] + linear_b * dz_im[i];
          const numMagSq = num_re * num_re + num_im * num_im;
          const den_re = a0 * dz2_re[i] + linear_a * dz_re[i] + sum_a;
          const den_im = a0 * dz2_im[i] + linear_a * dz_im[i];
          const denMagSq = den_re * den_re + den_im * den_im;
          let effect;
          if (denMagSq <= 1e-20 || isNaN(denMagSq) || isNaN(numMagSq)) {
            effect = 0;
          } else {
            const ratio = numMagSq / denMagSq;
            effect = ratio <= 1e-20 ? -200 : 10 * Math.log10(ratio);
          }
          if (output) output[i] = effect;
          const w = weights[i];
          num += residual[i] * effect * w;
          den += effect * effect * w;
        }
        return { num, den };
      }
    </script>
    <script>
      const EVAL_POINT_COUNT = 1000;

function generateEvaluationPoints() {
  const points = new Float64Array(EVAL_POINT_COUNT);
  const minLog = Math.log10(20);
  const maxLog = Math.log10(20000);
  const span = maxLog - minLog;
  points[0] = 20.0;
  points[EVAL_POINT_COUNT - 1] = 20000.0;
  for (let i = 1; i < EVAL_POINT_COUNT - 1; i++) {
    points[i] = Math.pow(10, minLog + (i / (EVAL_POINT_COUNT - 1)) * span);
  }
  return points;
}

function calculateRMSE(curve, target, bands, interpolateFn, sampleRate) {
  const evalFreqs = generateEvaluationPoints();
  const N = evalFreqs.length;
  const freqData = precomputeFreqData(evalFreqs, sampleRate, N);
  let sumSquaredError = 0;
  const effectBuf = new Float64Array(N);
  const totalEq = new Float64Array(N);
  for (let j = 0; j < bands.length; j++) {
    if (bands[j].enabled === false) continue;
    const coeffs = computeFilterCoeffs(
      bands[j].fc, bands[j].gain, bands[j].q, sampleRate, bands[j].type || 'PK'
    );
    evalFilterBatch(coeffs, freqData.dz_re, freqData.dz_im, freqData.dz2_re, freqData.dz2_im, N, effectBuf);
    for (let i = 0; i < N; i++) totalEq[i] += effectBuf[i];
  }
  for (let i = 0; i < N; i++) {
    let baselineDb = interpolateFn(curve, evalFreqs[i]);
    let targetDb = interpolateFn(target, evalFreqs[i]);
    let error = targetDb - (baselineDb + totalEq[i]);
    sumSquaredError += error * error;
  }
  return Math.sqrt(sumSquaredError / N);
}

function runAutoEQ(curve, target, tolerance, maxBands, interpolateFn, sampleRate) {
  if (!curve || curve.length === 0 || !target || target.length === 0) return [];
  const evalFreqs = generateEvaluationPoints();
  const N = evalFreqs.length;
  const freqData = precomputeFreqData(evalFreqs, sampleRate, N);

          );
          activeBands.forEach((b) => (b.enabled = true));
          autoEqBtn.disabled = false;
          autoEqBtn.textContent = 'Run AutoEQ';
          autoEqBtn.classList.remove('btn-trigger-running');
          renderAnchorList();
          drawGraph();
        }, 0);
      }
      function updateAccuracyDisplay() {
        const accuracyElement = document.getElementById('accuracy-rating');
        const currentSR = getSelectedSampleRate();
        if (curveData && targetData) {
          const activeFilters = getActiveFilterList();
          const currentErrorRMSE = calculateRMSE(
            curveData,
            targetData,
            activeFilters,
            interpolate,
            currentSR
          );
          let accuracyScore = 100 * (1 - currentErrorRMSE / 12);
          accuracyScore = Math.max(0, Math.min(100, accuracyScore));
          accuracyElement.innerText = `Accuracy: ${accuracyScore.toFixed(
            2
          )}% (±${currentErrorRMSE.toFixed(2)}dB)`;
          accuracyElement.classList.remove(
            'status-excellent',
            'status-warning',
            'status-critical',
            'status-disabled'
          );
          if (accuracyScore >= 97) {
            accuracyElement.classList.add('status-excellent');
            accuracyElement.style.color = '#10b981';
          } else if (accuracyScore >= 90) {
            accuracyElement.classList.add('status-warning');
            accuracyElement.style.color = '#eab308';
          } else {
            accuracyElement.classList.add('status-critical');
            accuracyElement.style.color = '#ef4444';
          }
        } else {
          accuracyElement.innerText = 'Accuracy: --';
          accuracyElement.classList.remove(
            'status-excellent',
            'status-warning',
            'status-critical'
          );
          accuracyElement.classList.add('status-disabled');
          accuracyElement.style.color = '#757575';
        }
      }
      function renderAnchorList() {
        const container = document.getElementById('anchor-list');
        const scrollTop = container.scrollTop;
        container.innerHTML = '';
        updateControlsAvailability();
        updateAccuracyDisplay();
        activeBands.forEach((band, idx) => {
          const row = document.createElement('div');
          row.className = 'band-row';
          if (!band.type) band.type = 'PK';
          band.q = clampFilterQ(band.q);
          if (band.enabled === undefined) band.enabled = true;
          if (!band.enabled) row.classList.add('band-disabled');
          const eyeSvg = band.enabled
            ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'
            : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
          row.innerHTML = `
            <div class="band-top">
              <button class="eye-toggle ${band.enabled ? '' : 'eye-disabled'}" data-idx="${idx}" title="${band.enabled ? 'Disable' : 'Enable'} band">${eyeSvg}</button>
              <select class="type-select filter-dropdown" data-idx="${idx}" data-field="type">
                <option value="PK" ${band.type === 'PK' ? 'selected' : ''}>PK</option>
                <option value="LSC" ${band.type === 'LSC' ? 'selected' : ''}>LSC</option>
                <option value="HSC" ${band.type === 'HSC' ? 'selected' : ''}>HSC</option>
              </select>
              <input type="number" class="freq-input filter-num-input" value="${band.fc.toFixed(2)}" step="0.01" data-idx="${idx}" data-field="fc">
              <button class="del-btn" data-idx="${idx}">X</button>
            </div>
            <div class="band-values">
              <input type="number" class="gain-input filter-num-input" value="${band.gain.toFixed(2)}" step="0.01" data-idx="${idx}" data-field="gain">
              <input type="number" class="q-input filter-num-input" value="${band.q.toFixed(3)}" step="0.001" data-idx="${idx}" data-field="q">
            </div>
          `;
          container.appendChild(row);
        });
        container.querySelectorAll('input, select').forEach((element) => {
          element.addEventListener('input', (e) => {
            const idx = parseInt(e.target.getAttribute('data-idx'));
            const field = e.target.getAttribute('data-field');
            const loopSR = getSelectedSampleRate();
            const nyquistLimit = loopSR / 2 - 1;
            if (field === 'type') {
              activeBands[idx][field] = e.target.value;
            } else {
              let val = parseFloat(e.target.value) || 0;
              if (field === 'fc') {
                val = Math.max(20, Math.min(nyquistLimit, val));
                e.target.value = val.toFixed(2);
              }
              if (field === 'q') {
                val = clampFilterQ(val);
                e.target.value = val.toFixed(3);
              }
              if (field === 'gain') {
                val = Math.max(-30, Math.min(30, val));
                e.target.value = val.toFixed(2);
              }
              activeBands[idx][field] = val;
            }
              invalidateDragCurveCache();
            updateAccuracyDisplay();
            drawGraph();
          });
        });
        container.querySelectorAll('.del-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.getAttribute('data-idx'));
            activeBands.splice(idx, 1);
            renderAnchorList();
            drawGraph();
          });
        });
        container.querySelectorAll('.eye-toggle').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
            activeBands[idx].enabled = !activeBands[idx].enabled;
            renderAnchorList();
            drawGraph();
          });
        });
        container.scrollTop = scrollTop;
      }
      document.getElementById('add-band-btn').addEventListener('click', () => {
        if (!curveData || !targetData) return;
        activeBands.push({ fc: 1000, gain: 0.0, q: 1.0, type: 'PK', enabled: true });
        renderAnchorList();
        drawGraph();
      });
      document.getElementById('file-curve').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          rawCurveData = reconstructData(parseFRFile(ev.target.result));
          activeBands = [];
          refreshNormalizedData();
          applySmoothingConfiguration();
          renderAnchorList();
          drawGraph();
        };
        if (e.target.files[0]) reader.readAsText(e.target.files[0]);
      });
      document.getElementById('file-target').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          rawTargetData = reconstructData(parseFRFile(ev.target.result));
          refreshNormalizedData();
          applySmoothingConfiguration();
          renderAnchorList();
          drawGraph();
        };
        if (e.target.files[0]) reader.readAsText(e.target.files[0]);
      });
      const bandSlider = document.getElementById('band-slider');
      const sliderVal = document.getElementById('slider-val');
      const autoEqBtn = document.getElementById('autoeq-trigger-btn');
      bandSlider.addEventListener('input', (e) => {
        maxBandsConstraint = parseInt(e.target.value);
        sliderVal.innerText = maxBandsConstraint;
      });
      autoEqBtn.addEventListener('click', () => {
        if (!curveData || !targetData) return;
        triggerAutoEQ();
      });
      const normFreqInput = document.getElementById('norm-freq-input');
      normFreqInput.addEventListener('input', (e) => {
        let val = parseInt(e.target.value) || 1000;
        val = Math.max(20, Math.min(20000, val));
        normFreq = val;
        reparseAndRedraw();
      });

      let dragState = null;
      let hoverBandIdx = -1;
      let dragRenderFrame = 0;
      let dragCurveCache = null;
      const HIT_RADIUS = 12;

      function scheduleDragRender() {
        if (dragRenderFrame) return;
        dragRenderFrame = requestAnimationFrame(() => {
          dragRenderFrame = 0;
          updateAccuracyDisplay();
          drawGraph();
        });
      }

      function updateDraggedBandInputs(idx, band) {
        const rowInputs = document.querySelectorAll(`[data-idx="${idx}"]`);
        rowInputs.forEach((input) => {
          if (input.getAttribute('data-field') === 'fc') input.value = band.fc.toFixed(2);
          if (input.getAttribute('data-field') === 'gain') input.value = band.gain.toFixed(2);
        });
      }

      function prepareDragCurveCache() {
        if (!curveData || !targetData || !dragState) return;
        const graphRightEdge = canvas.width - PADDING_RIGHT;
        const innerWidth = canvas.width - PADDING_LEFT - PADDING_RIGHT;
        const logMin = Math.log10(MIN_FREQ);
        const logMax = Math.log10(MAX_FREQ);
        const currentSR = getSelectedSampleRate();
        const activeFilters = getActiveFilterList();
        const frequencies = new Float64Array(graphRightEdge - PADDING_LEFT + 1);
        const baseline = new Float64Array(frequencies.length);
        const totalImpact = new Float64Array(frequencies.length);
        for (let xCoord = PADDING_LEFT; xCoord <= graphRightEdge; xCoord++) {
          const index = xCoord - PADDING_LEFT;
          const pct = index / innerWidth;
          frequencies[index] = Math.pow(10, logMin + pct * (logMax - logMin));
          baseline[index] = interpolate(curveData, frequencies[index]);
        }
        const bandEffects = activeFilters.map(() => new Float64Array(frequencies.length));
        activeFilters.forEach((band, bandIndex) => {
          for (let index = 0; index < frequencies.length; index++) {
            const effect = calculateFilterEffect(
              frequencies[index], band.fc, band.gain, band.q, currentSR, band.type || 'PK'
            );
            bandEffects[bandIndex][index] = effect;
            totalImpact[index] += effect;
          }
        });
        dragCurveCache = { frequencies, baseline, totalImpact, bandEffects, activeFilters };
      }

      function updateDragCurveCache() {
        if (!dragCurveCache || !dragState) return;
        const bandIndex = dragCurveCache.activeFilters.indexOf(activeBands[dragState.idx]);
        if (bandIndex < 0) return;
        const band = activeBands[dragState.idx];
        const effects = dragCurveCache.bandEffects[bandIndex];
        const currentSR = getSelectedSampleRate();
        for (let index = 0; index < effects.length; index++) {
          const previousEffect = effects[index];
          const nextEffect = calculateFilterEffect(
            dragCurveCache.frequencies[index], band.fc, band.gain, band.q, currentSR, band.type || 'PK'
          );
          effects[index] = nextEffect;
          dragCurveCache.totalImpact[index] += nextEffect - previousEffect;
        }
      }

      function invalidateDragCurveCache() {
        dragCurveCache = null;
      }

      function getCurveValueAtFreq(freq) {
        if (!curveData || curveData.length === 0) return 60;
        return interpolate(curveData, freq);
      }

      function getBandAtPosition(mx, my) {
        for (let i = activeBands.length - 1; i >= 0; i--) {
          const band = activeBands[i];
          if (band.enabled === false) continue;
          const bx = getX(band.fc);
          const by = getY(getCurveValueAtFreq(band.fc) + band.gain);
          const dx = mx - bx;
          const dy = my - by;
          if (dx * dx + dy * dy <= HIT_RADIUS * HIT_RADIUS) {
            return i;
          }
        }
        return -1;
      }

      function isNearBlueCurve(mx, my) {
        if (!curveData) return false;
        const f = getFreqFromX(mx);
        if (f < curveData[0].f || f > curveData[curveData.length - 1].f) return false;
        const curveDb = interpolate(curveData, f);
        const curveY = getY(curveDb);
        return Math.abs(my - curveY) <= 15;
      }

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 1) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const idx = getBandAtPosition(mx, my);
        if (idx >= 0) {
          dragState = { idx, startX: mx, startY: my, origFc: activeBands[idx].fc, origGain: activeBands[idx].gain };
          prepareDragCurveCache();
          canvas.style.cursor = 'grabbing';
          e.preventDefault();
        } else if (curveData && targetData && isNearBlueCurve(mx, my)) {
          const currentSR = getSelectedSampleRate();
          const nyquistLimit = currentSR / 2 - 1;
          let newFc = getFreqFromX(mx);
          newFc = Math.max(20, Math.min(nyquistLimit, newFc));
          const curveAtFc = getCurveValueAtFreq(newFc);
          let newGain = getDbFromY(my) - curveAtFc;
          newGain = Math.max(-30, Math.min(30, newGain));
          activeBands.push({
            fc: Math.round(newFc * 100) / 100,
            gain: Math.round(newGain * 100) / 100,
            q: 1.0,
            type: 'PK',
            enabled: true,
          });
          const newIdx = activeBands.length - 1;
          dragState = { idx: newIdx, startX: mx, startY: my, origFc: activeBands[newIdx].fc, origGain: activeBands[newIdx].gain };
          prepareDragCurveCache();
          renderAnchorList();
          drawGraph();
          canvas.style.cursor = 'grabbing';
          e.preventDefault();
        }
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        if (dragState) {
          const band = activeBands[dragState.idx];
          const currentSR = getSelectedSampleRate();
          const nyquistLimit = currentSR / 2 - 1;
          let newFc = getFreqFromX(mx);
          newFc = Math.max(20, Math.min(nyquistLimit, newFc));
          const curveAtFc = getCurveValueAtFreq(newFc);
          let newGain = getDbFromY(my) - curveAtFc;
          newGain = Math.max(-30, Math.min(30, newGain));
          band.fc = Math.round(newFc * 100) / 100;
          band.gain = Math.round(newGain * 100) / 100;
          updateDraggedBandInputs(dragState.idx, band);
          updateDragCurveCache();
          scheduleDragRender();
        } else {
          const idx = getBandAtPosition(mx, my);
          if (idx !== hoverBandIdx) {
            hoverBandIdx = idx;
            canvas.style.cursor = idx >= 0 ? 'grab' : 'default';
          }
        }
      });

      canvas.addEventListener('mouseup', (e) => {
        if (e.button !== 0) return;
        if (dragState) {
          dragState = null;
          dragCurveCache = null;
          canvas.style.cursor = hoverBandIdx >= 0 ? 'grab' : 'default';
        }
      });

      canvas.addEventListener('mouseleave', () => {
        hoverBandIdx = -1;
        if (!dragState) canvas.style.cursor = 'default';
      });

      canvas.addEventListener('contextmenu', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const idx = getBandAtPosition(mx, my);
        if (idx >= 0) {
          e.preventDefault();
          activeBands.splice(idx, 1);
          if (dragState && dragState.idx === idx) dragState = null;
          renderAnchorList();
          drawGraph();
        }
      });

      canvas.addEventListener('wheel', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        let idx = getBandAtPosition(mx, my);
        if (idx < 0 && dragState) idx = dragState.idx;
        if (idx >= 0) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? -0.05 : 0.05;
          let newQ = activeBands[idx].q + delta;
          newQ = clampFilterQ(newQ);
          activeBands[idx].q = Math.round(newQ * 1000) / 1000;
          if (dragState) updateDragCurveCache();
          renderAnchorList();
          drawGraph();
        }
      }, { passive: false });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button !== 1) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        let idx = getBandAtPosition(mx, my);
        if (idx < 0 && dragState) idx = dragState.idx;
        if (idx >= 0) {
          e.preventDefault();
          const currentType = activeBands[idx].type || 'PK';
          const typeIdx = FILTER_TYPES.indexOf(currentType);
          const nextType = FILTER_TYPES[(typeIdx + 1) % FILTER_TYPES.length];
          activeBands[idx].type = nextType;
          invalidateDragCurveCache();
          renderAnchorList();
          drawGraph();
        }
      });

      function drawGraph() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const innerWidth = canvas.width - PADDING_LEFT - PADDING_RIGHT;
        const innerHeight = canvas.height - PADDING_TOP - PADDING_BOTTOM;
        const graphRightEdge = canvas.width - PADDING_RIGHT;
        const graphBottomEdge = canvas.height - PADDING_BOTTOM;
        const currentSR = getSelectedSampleRate();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#161616';
        ctx.fillStyle = '#666';
        ctx.font =
          '10px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.setLineDash([]);
        for (let db = MIN_DB; db <= MAX_DB; db += 5) {
          let y = Math.round(getY(db)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(PADDING_LEFT, y);
          ctx.lineTo(graphRightEdge, y);
          ctx.stroke();
          ctx.textAlign = 'right';
          ctx.fillText(`${db}`, PADDING_LEFT - 10, y + 4);
        }
        const decades = [
          { start: 20, end: 100, step: 10 },
          { start: 100, end: 1000, step: 100 },
          { start: 1000, end: 10000, step: 1000 },
          { start: 10000, end: 20000, step: 1000 },
        ];
        const textLabels = [
          20, 30, 40, 50, 60, 70, 80, 90, 100, 200, 300, 400, 500, 600, 700, 800, 900,
          1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 15000, 20000,
        ];
        decades.forEach((decade) => {
          for (let f = decade.start; f <= decade.end; f += decade.step) {
            if (f > MAX_FREQ) break;
            let x = Math.round(getX(f)) + 0.5;
            ctx.beginPath();
            ctx.moveTo(x, PADDING_TOP);
            ctx.lineTo(x, graphBottomEdge);
            ctx.stroke();
            if (textLabels.includes(f)) {
              let label = f >= 1000 ? `${f / 1000}k` : f;
              ctx.textAlign = 'center';
              ctx.fillText(label, x, graphBottomEdge + 18);
            }
          }
        });
        ctx.strokeStyle = '#252525';
        ctx.strokeRect(
          Math.round(PADDING_LEFT) + 0.5,
          Math.round(PADDING_TOP) + 0.5,
          Math.round(innerWidth),
          Math.round(innerHeight)
        );
        if (targetData) {
          ctx.strokeStyle = '#757575';
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(getX(targetData[0].f), getY(targetData[0].db));
          for (let i = 1; i < targetData.length; i++)
            ctx.lineTo(getX(targetData[i].f), getY(targetData[i].db));
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (targetData && currentTolerance) {
          ctx.fillStyle = 'rgba(59, 130, 246, 0.04)';
          ctx.beginPath();
          for (let i = 0; i < targetData.length; i++) {
            ctx.lineTo(
              getX(targetData[i].f),
              getY(targetData[i].db + currentTolerance)
            );
          }
          for (let i = targetData.length - 1; i >= 0; i--) {
            ctx.lineTo(
              getX(targetData[i].f),
              getY(targetData[i].db - currentTolerance)
            );
          }
          ctx.closePath();
          ctx.fill();
        }
        if (curveData) {
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(getX(curveData[0].f), getY(curveData[0].db));
          for (let i = 1; i < curveData.length; i++)
            ctx.lineTo(getX(curveData[i].f), getY(curveData[i].db));
          ctx.stroke();
        }
        const activeFilters = getActiveFilterList();
        if (curveData && targetData && activeFilters.length > 0) {
          const logMin = Math.log10(MIN_FREQ);
          const logMax = Math.log10(MAX_FREQ);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let xCoord = PADDING_LEFT; xCoord <= graphRightEdge; xCoord++) {
            const cacheIndex = xCoord - PADDING_LEFT;
            const pct = cacheIndex / innerWidth;
            const currentF = dragCurveCache
              ? dragCurveCache.frequencies[cacheIndex]
              : Math.pow(10, logMin + pct * (logMax - logMin));
            let baselineDb = dragCurveCache
              ? dragCurveCache.baseline[cacheIndex]
              : interpolate(curveData, currentF);
            let totalEqImpact = dragCurveCache
              ? dragCurveCache.totalImpact[cacheIndex]
              : getAccumulatedEqImpact(currentF, activeFilters, currentSR);
            let finalRenderedDb = baselineDb + totalEqImpact;
            if (xCoord === PADDING_LEFT) ctx.moveTo(xCoord, getY(finalRenderedDb));
            else ctx.lineTo(xCoord, getY(finalRenderedDb));
          }
          ctx.stroke();
        }

        activeBands.forEach((band, idx) => {
          if (band.enabled === false) return;
          drawBandNode(band, idx, currentSR, graphRightEdge, graphBottomEdge);
        });
      }

      function drawBandNode(band, idx, currentSR, graphRightEdge, graphBottomEdge) {
        const cx = getX(band.fc);
        const curveBaseDb = getCurveValueAtFreq(band.fc);
        const cy = getY(curveBaseDb + band.gain);

        const innerWidth = canvas.width - PADDING_LEFT - PADDING_RIGHT;
        const previewWidth = innerWidth / (4 * Math.max(band.q, 0.01));
        const halfWidth = previewWidth / 2;
        const startX = Math.max(PADDING_LEFT, cx - halfWidth);
        const endX = Math.min(canvas.width - PADDING_RIGHT, cx + halfWidth);
        const startFreq = getFreqFromX(startX);
        const endFreq = getFreqFromX(endX);
        const samplePoints = 360;
        const shapePoints = [];
        const nodeCenterY = getY(curveBaseDb + band.gain);
        const centerEffect = calculateFilterEffect(
          band.fc,
          band.fc,
          band.gain,
          band.q,
          currentSR,
          band.type || 'PK'
        );
        const centerShapeY = getY(60 + centerEffect);
        for (let i = 0; i <= samplePoints; i++) {
          const pct = i / samplePoints;
          const f = Math.pow(
            10,
            Math.log10(startFreq) +
              pct * (Math.log10(endFreq) - Math.log10(startFreq))
          );
          const effect = calculateFilterEffect(
            f,
            band.fc,
            band.gain,
            band.q,
            currentSR,
            band.type || 'PK'
          );
          const shapeY = getY(60 + effect);
          shapePoints.push({ x: getX(f), y: nodeCenterY + (shapeY - centerShapeY) });
        }

        const nodeColor = band.type === 'LSC' ? '#3b82f6' : band.type === 'HSC' ? '#f59e0b' : '#10b981';

        ctx.strokeStyle = nodeColor + '55';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(shapePoints[0].x, shapePoints[0].y);
        for (let p of shapePoints) {
          ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        const isHovered = hoverBandIdx === idx;
        const isDragging = dragState && dragState.idx === idx;
        const radius = isHovered || isDragging ? 8 : 6;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#111';
        ctx.fill();
        ctx.strokeStyle = nodeColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = nodeColor;
        ctx.fill();
      }

      function calculateAutomatedPreamp() {
        const activeFilters = getActiveFilterList();
        if (!activeFilters || activeFilters.length === 0) return 0.0;
        let maxGainFound = -Infinity;
        const scanResolutionSteps = 1000;
        const logMin = Math.log10(MIN_FREQ);
        const logMax = Math.log10(MAX_FREQ);
        const currentSR = getSelectedSampleRate();
        for (let i = 0; i <= scanResolutionSteps; i++) {
          const pct = i / scanResolutionSteps;
          const currentF = Math.pow(10, logMin + pct * (logMax - logMin));
          const accumulatedGain = getAccumulatedEqImpact(
            currentF,
            activeFilters,
            currentSR
          );
          if (accumulatedGain > maxGainFound) {
            maxGainFound = accumulatedGain;
          }
        }
        return -maxGainFound;
      }
      function parseEQFile(text) {
        const importedBands = [];
        const nyquistLimit = getSelectedSampleRate() / 2 - 1;
        const filterPattern = /^\s*Filter\s+\d+\s*:\s*(ON|OFF)\s+(PK|LSC|HSC)\s+Fc\s+([-+]?\d*\.?\d+)\s+Hz\s+Gain\s+([-+]?\d*\.?\d+)\s+dB\s+Q\s+([-+]?\d*\.?\d+)\s*$/i;
        text.split(/\r?\n/).forEach((line) => {
          const match = line.match(filterPattern);
          if (!match) return;
          const fc = Math.max(20, Math.min(nyquistLimit, parseFloat(match[3])));
          const gain = Math.max(-30, Math.min(30, parseFloat(match[4])));
          const q = clampFilterQ(parseFloat(match[5]));
          if (![fc, gain, q].every(Number.isFinite)) return;
          importedBands.push({
            fc,
            gain,
            q,
            type: match[2].toUpperCase(),
            enabled: match[1].toUpperCase() !== 'OFF',
          });
        });
        return importedBands;
      }
      document.getElementById('export-eq-btn').addEventListener('click', () => {
        if (!curveData || !targetData) return;
        const preampValue = calculateAutomatedPreamp();
        let apoConfigText = `Preamp: ${preampValue.toFixed(1)} dB\n`;
        activeBands.forEach((band, index) => {
          const type = band.type || 'PK';
          const fc = band.fc.toFixed(2);
          const gain = band.gain.toFixed(2);
          const q = band.q.toFixed(3);
          const onOff = band.enabled === false ? 'OFF' : 'ON';
          apoConfigText += `Filter ${
            index + 1
          }: ${onOff} ${type} Fc ${fc} Hz Gain ${gain} dB Q ${q}\n`;
        });
        const blobData = new Blob([apoConfigText], {
          type: 'text/plain;charset=utf-8',
        });
        const downloadUrl = URL.createObjectURL(blobData);
        const virtualLink = document.createElement('a');
        virtualLink.href = downloadUrl;
        virtualLink.download = 'EQ.txt';
        document.body.appendChild(virtualLink);
        virtualLink.click();
        document.body.removeChild(virtualLink);
        URL.revokeObjectURL(downloadUrl);
      });
      document.getElementById('file-eq').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (!rawCurveData || !curveData || !rawTargetData || !targetData) return;
          activeBands = parseEQFile(ev.target.result);
          renderAnchorList();
          drawGraph();
        };
        if (e.target.files[0]) reader.readAsText(e.target.files[0]);
      });
      document.getElementById('export-curve-btn').addEventListener('click', () => {
        if (!curveData || !targetData) return;
        let curveText = '';
        const currentSR = getSelectedSampleRate();
        const activeFilters = getActiveFilterList();
        curveData.forEach((pt) => {
          const currentF = pt.f;
          const baselineDb = pt.db;
          const totalEqImpact = getAccumulatedEqImpact(
            currentF,
            activeFilters,
            currentSR
          );
          const finalRenderedDb = baselineDb + totalEqImpact;
          curveText += `${currentF.toFixed(2)} ${finalRenderedDb.toFixed(2)}\n`;
        });
        const blobData = new Blob([curveText], {
          type: 'text/plain;charset=utf-8',
        });
        const downloadUrl = URL.createObjectURL(blobData);
        const virtualLink = document.createElement('a');
        virtualLink.href = downloadUrl;
        virtualLink.download = 'Equalized_Curve.txt';
        document.body.appendChild(virtualLink);
        virtualLink.click();
        document.body.removeChild(virtualLink);
        URL.revokeObjectURL(downloadUrl);
      });
      renderAnchorList();
      resizeCanvas();
    </script>
  </body>
